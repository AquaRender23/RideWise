<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Book Ride | RideWise</title>

    <link rel="stylesheet" href="../static/book_ride.css">

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
</head>

<body>

    <div class="layout">

        <!-- SIDEBAR -->
        <div class="sidebar">

            <div class="sidebar-header">
                <img src="../static/images/logo.png" class="sidebar-logo" alt="RideWise Logo">
                <span class="brand-name">RIDEWISE</span>
            </div>

            <nav>
                <a href="{{ url_for('rider_dashboard') }}">Dashboard</a>
                <a href="{{ url_for('book_ride') }}" class="active">Book Ride</a>
                <a href="{{ url_for('rider_history') }}">My Rides</a>
                <a href="{{ url_for('logout') }}">Logout</a>
            </nav>

        </div>


        <!-- MAIN CONTENT -->
        <div class="main">

            <h1>BOOK AN ECO RIDE 🌿</h1>
            <p class="tagline">Drive smart. Travel green.</p>

            <div class="content-wrapper">

                <!-- LEFT FORM -->
                <div class="form-section">

                    <form method="POST" action="{{ url_for('book_ride') }}">

                        <label>Start Location</label>
                        <input type="text" name="start" placeholder="Enter starting location" required>

                        <label>Destination</label>
                        <input type="text" name="end" placeholder="Enter destination" required>

                        <div class="row">
                            <div class="col">
                                <label>Date</label>
                                <input type="date" name="date" required>
                            </div>

                            <div class="col">
                                <label>Time</label>
                                <input type="time" name="time" required>
                            </div>
                        </div>

                        <label>Number of People</label>
                        <input type="number" name="people" min="1" required>

                        <button type="submit">Book Ride</button>
                        

                    </form>

                </div>


                <div class="map-section" style="position: relative;">

                    <div id="route-info" style="
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            padding: 10px 18px;
            border-radius: 25px;
            font-weight: 600;
            font-size: 15px;
            color: #d4af37;
            z-index: 1000;
         ">
                    </div>

                    <div id="map"></div>
                </div>

            </div>

        </div>

    </div>

    <script>
        var map = L.map('map').setView([12.9716, 77.5946], 12);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        let routeLayer = null;
        let startMarker = null;
        let endMarker = null;

        async function getCoordinates(address) {
            const response = await fetch(
                `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address)}&countrycodes=in&limit=1`
            );

            const data = await response.json();

            if (data.length > 0) {
                return [parseFloat(data[0].lat), parseFloat(data[0].lon)];
            }

            return null;
        }

        async function drawRoute() {
            const start = document.querySelector('input[name="start"]').value;
            const end = document.querySelector('input[name="end"]').value;

            if (!start || !end) return;

            const startCoords = await getCoordinates(start);
            const endCoords = await getCoordinates(end);

            if (!startCoords || !endCoords) {
                alert("Invalid location");
                return;
            }

            const response = await fetch(
                `https://router.project-osrm.org/route/v1/driving/${startCoords[1]},${startCoords[0]};${endCoords[1]},${endCoords[0]}?overview=full&geometries=geojson`
            );

            const data = await response.json();

            if (!data.routes || data.routes.length === 0) {
                alert("Route not found");
                return;
            }

            const route = data.routes[0];

            const distance = (route.distance / 1000).toFixed(2);
            const duration = (route.duration / 60).toFixed(0);

            // Remove old route & markers
            if (routeLayer) map.removeLayer(routeLayer);
            if (startMarker) map.removeLayer(startMarker);
            if (endMarker) map.removeLayer(endMarker);

            // Draw route
            routeLayer = L.geoJSON(route.geometry, {
                style: { color: '#00ffaa', weight: 5 }
            }).addTo(map);

            // Add markers
            startMarker = L.marker(startCoords).addTo(map).bindPopup("Start").openPopup();
            endMarker = L.marker(endCoords).addTo(map).bindPopup("End");

            map.fitBounds(routeLayer.getBounds());

            // Display nicely on page instead of alert
            document.getElementById("route-info").innerHTML =
                `Distance: ${distance} km | Estimated Time: ${duration} mins`;
        }

        document.querySelector('input[name="start"]').addEventListener("change", drawRoute);
        document.querySelector('input[name="end"]').addEventListener("change", drawRoute);
    </script>


</body>

</html>
